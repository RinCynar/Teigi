name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup & FFmpeg
        shell: pwsh
        run: |
          choco install innosetup ffmpeg -y --no-progress

      - name: Build Windows Distributables
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/build_dist.ps1 -Arch x64

      - name: Prepare Windows Artifacts
        shell: pwsh
        run: |
          Get-ChildItem build/outputdir -File | ForEach-Object { Write-Host "Artifact: $($_.FullName)" }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/outputdir/windows-*-release.zip
            build/outputdir/windows-*-ffmpeg-release.zip
            build/outputdir/windows-*-installer.exe
          draft: false
          prerelease: false
          generate_release_notes: true

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS DMG and ZIP
        run: |
          mkdir -p dist
          APP_PATH="build/macos/Build/Products/Release/teigi.app"
          hdiutil create -volname "Teigi" -srcfolder "$APP_PATH" -ov -format UDZO dist/teigi-macos-universal.dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/teigi-macos-universal.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/teigi-macos-universal.dmg
            dist/teigi-macos-universal.zip
          draft: false
          prerelease: false
          generate_release_notes: true

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libjson-glib-dev ninja-build libsecret-1-dev appstream wget file libfuse2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Bundle (.tar.gz) and .AppImage
        run: |
          mkdir -p dist
          tar -czvf dist/teigi-linux-x64.tar.gz -C build/linux/x64/release/bundle .

          # Create AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          if [ -d build/linux/x64/release/bundle/lib ]; then
            cp -r build/linux/x64/release/bundle/lib/* AppDir/usr/lib/ 2>/dev/null || true
          fi

          printf '[Desktop Entry]\nName=Teigi\nExec=teigi\nIcon=teigi\nType=Application\nCategories=AudioVideo;AudioVideoEditing;\nComment=Desktop media converter built with Flutter and FFmpeg\nTerminal=false\n' > AppDir/teigi.desktop
          cp AppDir/teigi.desktop AppDir/usr/share/applications/

          if [ -f assets/icon/app_icon.png ]; then
            cp assets/icon/app_icon.png AppDir/teigi.png
            cp assets/icon/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/teigi.png
          elif [ -f macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png ]; then
            cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png AppDir/teigi.png
            cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png AppDir/usr/share/icons/hicolor/256x256/apps/teigi.png
          fi

          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexport LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"\nexport PATH="${HERE}/usr/bin:${PATH}"\nexec "${HERE}/usr/bin/teigi" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage || wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/teigi-linux-x64.AppImage

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/teigi-linux-x64.tar.gz
            dist/teigi-linux-x64.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true

  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Split-Per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Prepare Android Artifacts
        run: |
          mkdir -p dist
          APK_DIR="build/app/outputs/flutter-apk"
          [ -f "$APK_DIR/app-arm64-v8a-release.apk" ] && cp "$APK_DIR/app-arm64-v8a-release.apk" dist/teigi-android-arm64-v8a.apk
          [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ] && cp "$APK_DIR/app-armeabi-v7a-release.apk" dist/teigi-android-armeabi-v7a.apk
          [ -f "$APK_DIR/app-x86_64-release.apk" ] && cp "$APK_DIR/app-x86_64-release.apk" dist/teigi-android-x86_64.apk
          [ -f "$APK_DIR/app-release.apk" ] && cp "$APK_DIR/app-release.apk" dist/teigi-android-universal.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/teigi-android-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
