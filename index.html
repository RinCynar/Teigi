<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7fc" />
    <meta
      name="description"
      content="Teigi 是一个基于 Flutter 和 FFmpeg 的桌面媒体转换工具。"
    />
    <title>Teigi</title>
    <link
      rel="icon"
      href="macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Teigi">
          <img
            class="brand-mark"
            src="macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png"
            alt=""
          />
          <span class="brand-name">Teigi</span>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-context">桌面媒体转换</span>
        </a>

        <nav class="topnav" aria-label="主导航">
          <a class="topnav-link active" href="#downloads">下载</a>
          <a
            class="icon-button"
            href="https://github.com/RinCynar/Teigi"
            target="_blank"
            rel="noreferrer"
            aria-label="打开 GitHub 仓库"
            title="GitHub 仓库"
          >
            <i data-lucide="github" aria-hidden="true"></i>
          </a>
          <button
            class="icon-button"
            id="theme-toggle"
            type="button"
            aria-label="切换主题"
            title="切换主题"
          >
            <i data-lucide="moon" aria-hidden="true"></i>
          </button>
        </nav>
      </header>

      <main>
        <section class="workspace-heading" aria-labelledby="page-title">
          <div>
            <p class="eyebrow"><span class="status-dot"></span>开源桌面工具</p>
            <h1 id="page-title">Teigi</h1>
            <p class="heading-copy">
              安静、清晰地处理你的音频、视频与图片文件。
            </p>
          </div>
          <div class="sync-status" id="sync-status" data-state="loading" aria-live="polite">
            <i data-lucide="loader-circle" aria-hidden="true"></i>
            <span>正在读取版本清单</span>
          </div>
        </section>

        <section class="release-band" id="downloads" aria-labelledby="release-heading">
          <div class="release-header">
            <div>
              <div class="section-label">
                <i data-lucide="package-check" aria-hidden="true"></i>
                <span>最新发布</span>
              </div>
              <div class="release-title-line">
                <h2 id="release-heading">正在连接 GitHub</h2>
                <span class="version-chip" id="release-tag">读取中</span>
              </div>
              <p class="release-meta" id="release-meta">稍等片刻，正在同步版本信息。</p>
              <p class="release-notes" id="release-notes"></p>
            </div>
            <a
              class="tonal-button disabled"
              id="release-link"
              href="#"
              target="_blank"
              rel="noreferrer"
              aria-disabled="true"
            >
              <i data-lucide="external-link" aria-hidden="true"></i>
              <span>查看 Release</span>
            </a>
          </div>
        </section>

        <section class="downloads-layout" aria-labelledby="files-heading">
          <div class="downloads-column">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Release assets</p>
                <h2 id="files-heading">下载文件</h2>
                <p class="section-copy" id="assets-summary">文件将从版本清单自动同步。</p>
              </div>
              <button class="outlined-button" id="refresh-button" type="button">
                <i data-lucide="refresh-cw" aria-hidden="true"></i>
                <span>刷新</span>
              </button>
            </div>

            <div class="download-list" id="download-list" aria-live="polite">
              <div class="loading-list" aria-label="正在加载下载文件">
                <div class="loading-row"></div>
                <div class="loading-row"></div>
              </div>
            </div>
          </div>

          <aside class="release-aside" aria-label="版本信息">
            <div class="aside-block">
              <div class="section-label">
                <i data-lucide="info" aria-hidden="true"></i>
                <span>版本信息</span>
              </div>
              <dl class="release-facts">
                <div>
                  <dt>发布版本</dt>
                  <dd id="fact-version">读取中</dd>
                </div>
                <div>
                  <dt>发布日期</dt>
                  <dd id="fact-date">读取中</dd>
                </div>
                <div>
                  <dt>可用文件</dt>
                  <dd id="fact-assets">读取中</dd>
                </div>
              </dl>
            </div>

            <div class="aside-block aside-links">
              <div class="section-label">
                <i data-lucide="layers-3" aria-hidden="true"></i>
                <span>项目</span>
              </div>
              <a href="https://github.com/RinCynar/Teigi" target="_blank" rel="noreferrer">
                <span>GitHub 仓库</span>
                <i data-lucide="arrow-up-right" aria-hidden="true"></i>
              </a>
              <a href="https://github.com/RinCynar/Teigi/releases" target="_blank" rel="noreferrer">
                <span>全部 Releases</span>
                <i data-lucide="arrow-up-right" aria-hidden="true"></i>
              </a>
            </div>
          </aside>
        </section>
      </main>

      <footer class="site-footer">
        <span>Teigi · 开源桌面媒体转换工具</span>
        <span>Release 清单由仓库工作流自动同步</span>
      </footer>
    </div>

    <noscript>
      <div class="noscript-message">此下载页需要启用 JavaScript 才能读取最新 Release。</div>
    </noscript>
  </body>
</html>
