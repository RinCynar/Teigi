<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7fc" />
    <meta
      name="description"
      data-i18n-content="meta.description"
      content="Teigi 是一个基于 Flutter 和 FFmpeg 的开源跨平台媒体转换工具（支持 Android / Windows / macOS / Linux）"
    />
    <title>Teigi</title>
    <link
      rel="icon"
      href="assets/icon/app_icon.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Teigi">
          <img
            class="brand-mark"
            src="assets/icon/app_icon.png"
            alt=""
          />
          <span class="brand-name">Teigi</span>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-context"></span>
        </a>

        <nav class="topnav" data-i18n-aria-label="nav.label" aria-label="主导航">
          <a class="topnav-link active" href="#downloads" data-i18n="nav.downloads">下载</a>
          <a
            class="icon-button"
            href="https://github.com/RinCynar/Teigi"
            target="_blank"
            rel="noreferrer"
            data-i18n-aria-label="nav.github"
            data-i18n-title="nav.github"
            aria-label="打开 GitHub 仓库"
            title="GitHub 仓库"
          >
            <i data-lucide="github" aria-hidden="true"></i>
          </a>
          <label class="language-control">
            <i data-lucide="languages" aria-hidden="true"></i>
            <span class="visually-hidden" data-i18n="language.label">语言</span>
            <select id="language-select" data-i18n-aria-label="language.label" aria-label="语言">
              <option value="zh">中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
            </select>
          </label>
          <button
            class="icon-button"
            id="theme-toggle"
            type="button"
            data-i18n-aria-label="theme.toggle"
            data-i18n-title="theme.toggle"
            aria-label="切换主题"
            title="切换主题"
          >
            <i data-lucide="moon" aria-hidden="true"></i>
          </button>
        </nav>
      </header>

      <main>
        <section class="workspace-heading" aria-labelledby="page-title">
          <div>
            <p class="eyebrow"><span class="status-dot"></span><span data-i18n="hero.eyebrow">开源跨平台媒体工具</span></p>
            <h1 id="page-title">Teigi</h1>
            <p class="heading-copy" data-i18n="hero.copy">
              在桌面端与移动端上，安静、清晰地处理你的音视频与图片文件。
            </p>
          </div>
          <div class="sync-status" id="sync-status" data-state="loading" aria-live="polite">
            <i data-lucide="loader-circle" aria-hidden="true"></i>
            <span data-i18n="status.loadingManifest">正在读取版本清单</span>
          </div>
        </section>

        <section class="release-band" id="downloads" aria-labelledby="release-heading">
          <div class="release-header">
            <div>
              <div class="section-label">
                <i data-lucide="package-check" aria-hidden="true"></i>
                <span data-i18n="release.latest">最新发布</span>
              </div>
              <div class="release-title-line">
                <h2 id="release-heading" data-i18n="release.connecting">正在连接 GitHub</h2>
                <span class="version-chip" id="release-tag" data-i18n="common.loading">读取中</span>
              </div>
              <p class="release-meta" id="release-meta" data-i18n="release.syncing">稍等片刻，正在同步版本信息。</p>
              <p class="release-notes" id="release-notes"></p>
            </div>
            <a
              class="tonal-button disabled"
              id="release-link"
              href="#"
              target="_blank"
              rel="noreferrer"
              aria-disabled="true"
            >
              <i data-lucide="external-link" aria-hidden="true"></i>
              <span data-i18n="release.view">查看 Release</span>
            </a>
          </div>
        </section>

        <section class="downloads-layout" aria-labelledby="files-heading">
          <div class="downloads-column">
            <div class="section-heading">
              <div>
                <p class="eyebrow" data-i18n="downloads.eyebrow">Release assets</p>
                <h2 id="files-heading" data-i18n="downloads.title">下载文件</h2>
                <p class="section-copy" id="assets-summary" data-i18n="downloads.syncing">文件将从版本清单自动同步。</p>
              </div>
              <button class="outlined-button" id="refresh-button" type="button" data-i18n-aria-label="downloads.refresh">
                <i data-lucide="refresh-cw" aria-hidden="true"></i>
                <span data-i18n="downloads.refresh">刷新</span>
              </button>
            </div>

            <div class="download-list" id="download-list" aria-live="polite">
              <div class="loading-list" data-i18n-aria-label="downloads.loading" aria-label="正在加载下载文件">
                <div class="loading-row"></div>
                <div class="loading-row"></div>
              </div>
            </div>
          </div>

          <aside class="release-aside" data-i18n-aria-label="aside.releaseInfo" aria-label="版本信息">
            <div class="aside-block">
              <div class="section-label">
                <i data-lucide="info" aria-hidden="true"></i>
                <span data-i18n="aside.releaseInfo">版本信息</span>
              </div>
              <dl class="release-facts">
                <div>
                  <dt data-i18n="facts.version">发布版本</dt>
                  <dd id="fact-version" data-i18n="common.loading">读取中</dd>
                </div>
                <div>
                  <dt data-i18n="facts.date">发布日期</dt>
                  <dd id="fact-date" data-i18n="common.loading">读取中</dd>
                </div>
                <div>
                  <dt data-i18n="facts.assets">可用文件</dt>
                  <dd id="fact-assets" data-i18n="common.loading">读取中</dd>
                </div>
              </dl>
            </div>

            <div class="aside-block aside-links">
              <div class="section-label">
                <i data-lucide="layers-3" aria-hidden="true"></i>
                <span data-i18n="project.title">项目</span>
              </div>
              <a href="https://github.com/RinCynar/Teigi" target="_blank" rel="noreferrer">
                <span data-i18n="project.repository">GitHub 仓库</span>
                <i data-lucide="arrow-up-right" aria-hidden="true"></i>
              </a>
              <a href="https://github.com/RinCynar/Teigi/releases" target="_blank" rel="noreferrer">
                <span data-i18n="project.releases">全部 Releases</span>
                <i data-lucide="arrow-up-right" aria-hidden="true"></i>
              </a>
            </div>
          </aside>
        </section>
      </main>

      <footer class="site-footer">
        <span data-i18n="footer.product">Teigi · 开源跨平台媒体转换工具</span>
        <span data-i18n="footer.manifest">Release 清单由仓库工作流自动同步</span>
      </footer>
    </div>

    <noscript>
      <div class="noscript-message">This download page requires JavaScript to read the latest Release.</div>
    </noscript>
  </body>
</html>
